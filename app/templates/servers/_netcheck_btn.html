{# Кнопка «Проверить сеть» строки. oob — при inline-правке IP из _cell.html. #}
<button type="button" class="icon-btn" id="netcheck-btn-{{ server.id }}"{% if oob %} hx-swap-oob="true"{% endif %}
        {% if netcheck_ip(server.ip_address) %}
        data-netcheck-url="{{ url_for('servers.netcheck_run', server_id=server.id, tool='TOOL') }}"
        data-netcheck-name="{{ server.name }}" data-netcheck-ip="{{ server.ip_address }}"
        title="Проверить сеть" aria-label="Проверить сеть {{ server.name }}"
        {% else %}
        disabled style="opacity: .3; cursor: default"
        title="У сервера нет корректного IP" aria-label="У {{ server.name }} нет корректного IP"
        {% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
</button>
